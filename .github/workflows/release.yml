name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -q
      - name: Build exe
        shell: pwsh
        env: {VERSION: "${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}"}
        run: |
          $env:VERSION = $env:VERSION.TrimStart('v')
          ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: "dist/*.zip"}
      - name: Attach to release
        if: github.ref_type == 'tag'
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" dist/*.zip --clobber || echo "release not created yet - artifact kept"
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension zip (manifest stamped with the tag version)
        run: |
          VER="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          python3 scripts/build_extension_zip.py ${VER#v}
      - uses: actions/upload-artifact@v4
        with: {name: chrome-extension, path: "dist/liscia-agent-chrome-extension-*.zip"}
      - name: Attach to release (waits up to 20 min for the release to be published)
        if: github.ref_type == 'tag'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for i in $(seq 1 40); do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" dist/liscia-agent-chrome-extension-*.zip --clobber; exit 0
            fi
            sleep 30
          done
          echo "release not created - zip kept as the chrome-extension artifact"
